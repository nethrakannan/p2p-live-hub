<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Hub - Lobby</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 500px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        .room-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .input-field { padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; text-align: center; }
        .action-btn { background-color: #3498db; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .action-btn:hover { background-color: #2980b9; }
        .footer { margin-top: 40px; font-size: 12px; color: #bdc3c7; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Welcome to P2P File Hub</h1>
    <div class="subtitle">Enter a custom room name to share files securely with your friends</div>
    
    <form action="/join" method="post" class="room-form">
        <input type="text" name="room_name" class="input-field" placeholder="e.g., class-notes, group-project" required autocomplete="off">
        <button type="submit" class="action-btn">Enter / Create Room</button>
    </form>
    
    <div class="footer">P2P File Sharing Network System • Localized Public Sharing</div>
</div>

</body>
</html>
