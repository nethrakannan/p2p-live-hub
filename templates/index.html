<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Sharing Network</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        .upload-section { background: #ebf5fb; padding: 20px; border-radius: 6px; border: 1px dashed #3498db; margin-bottom: 30px; text-align: center; }
        .upload-btn { background-color: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .upload-btn:hover { background-color: #27ae60; }
        .file-list { list-style: none; padding: 0; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #fafafa; margin-bottom: 10px; border-radius: 6px; border: 1px solid #eaeaea; }
        .file-name { font-weight: 500; font-size: 15px; color: #34495e; max-width: 50%; word-break: break-all; }
        .actions { display: flex; gap: 8px; }
        .download-btn { background-color: #3498db; color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .download-btn:hover { background-color: #2980b9; }
        .delete-btn { background-color: #e74c3c; color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .delete-btn:hover { background-color: #c0392b; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #bdc3c7; }
    </style>
</head>
<body>

<div class="container">
    <h1>Peer-to-Peer File Hub</h1>
    <div class="subtitle">Direct local network file sharing over Hotspot</div>
    
    <div class="upload-section">
        <h3>📤 Share a New File</h3>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required><br>
            <button type="submit" class="upload-btn">Upload to Peer Network</button>
        </form>
    </div>

    <h3>Available Files on Peer Network:</h3>
    <ul class="file-list">
        {% for file in files %}
        <li class="file-item">
            <span class="file-name">{{ file }}</span>
            <div class="actions">
                <a href="/download/{{ file }}" class="download-btn">Download</a>
                <!-- NEW DELETE LINK -->
                <a href="/delete/{{ file }}" class="delete-btn" onclick="return confirm('Are you sure you want to delete this file?');">Delete</a>
            </div>
        </li>
        {% endfor %}
    </ul>
    
    <div class="footer">P2P File Sharing Network System • Running via Python</div>
</div>

</body>
</html>
